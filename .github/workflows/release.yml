name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mvnminx
        uses: actions/checkout@v4
        with:
          path: mvnminx

      - name: Checkout mvnmin 1.0.3
        uses: actions/checkout@v4
        with:
          repository: elasticpath/mvnmin
          ref: mvnmin-1.0.3
          path: mvnmin

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin

      - name: Install mvnmin 1.0.3 to local Maven repo
        run: mvn install -DskipTests -f mvnmin/pom.xml

      - name: Build mvnminx
        run: mvn package -f mvnminx/pom.xml

      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: mvnminx
          path: mvnminx/target/mvnminx-*.jar
